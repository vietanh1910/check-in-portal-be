spring.application.name=hunter-point

# MySQL Datasource Settings
spring.datasource.url=jdbc:mysql://localhost:3306/hunter_point?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Settings
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# JWT Secret Key
jwt.secret======================your-super-long-and-secret-key======================

server.port=8080